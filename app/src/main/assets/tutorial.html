<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif; background:transparent; overflow:hidden;}
  .wrap{display:flex;flex-direction:column;align-items:center;padding:1rem;height:100vh;justify-content:center;position:relative;}
  .scene{display:flex;align-items:flex-end;justify-content:center;gap:0;position:relative;margin-bottom:1rem}
  .robot-container{display:flex;flex-direction:column;align-items:center;position:relative;animation:bobble 3s ease-in-out infinite}
  @keyframes bobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .robot-head{position:relative;width:110px;height:100px;background:#f5f5f5;border-radius:50% 50% 45% 45%;display:flex;align-items:center;justify-content:center;border:2.5px solid #e0e0e0;box-shadow:0 10px 20px rgba(0,0,0,0.1)}
  .ear-l,.ear-r{position:absolute;width:28px;height:28px;background:#5dcaa5;border-radius:50%;top:12px}
  .ear-l{left:-10px}
  .ear-r{right:-10px}
  .face-screen{width:68px;height:68px;background:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .robot-body{width:110px;height:95px;background:#f5f5f5;border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;display:flex;align-items:center;justify-content:center;border:2.5px solid #e0e0e0;position:relative;margin-top:-12px;box-shadow:0 10px 15px rgba(0,0,0,0.05)}
  .body-decor{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:60px;height:30px;background:#5dcaa5;border-radius:40%;opacity:.6}
  .name-tag{font-size:11px;font-weight:700;color:#444;letter-spacing:.5px;position:absolute;bottom:20px}
  .arm-l,.arm-r{position:absolute;width:26px;height:40px;background:#f5f5f5;border-radius:30px;border:2px solid #e0e0e0;top:20px;transition:transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)}
  .arm-l{left:-20px;transform:rotate(15deg);transform-origin:top center}
  .arm-r{right:-20px;transform:rotate(-15deg);transform-origin:top center}
  .base{width:100px;height:14px;background:#dce0e3;border-radius:50%;margin-top:2px}
  
  /* Pointing Animations */
  /* Top-Right (viewer's right): arm-l pointing up-right */
  .robot-container.point-tr .arm-l{transform:rotate(-135deg) scaleY(1.2);}
  /* Bottom-Right (viewer's right): arm-l pointing down-right */
  .robot-container.point-br .arm-l{transform:rotate(-45deg) scaleY(1.2);}
  /* Bottom-Center: both arms down */
  .robot-container.point-down .arm-l{transform:rotate(0deg);}
  .robot-container.point-down .arm-r{transform:rotate(0deg);}

  .dialogue-box{position:relative;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-radius:18px;border:2px solid #5dcaa5;padding:12px 16px;max-width:280px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,0.15);margin-bottom:1rem}
  .dialogue-box::after{content:'';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#5dcaa5}
  .dialogue-box::before{content:'';position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;z-index:1}
  .dialogue-text{font-size:14px;font-weight:700;color:#333;line-height:1.4;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center}
  
  .controls{display:flex;gap:10px;justify-content:center;margin-top:1rem}
  .btn{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;padding:8px 16px;border-radius:20px;border:2px solid #5dcaa5;background:#fff;color:#0f6e56;cursor:pointer;transition:all .18s;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
  .btn:active{transform:scale(0.95);}
  .btn.primary{background:#5dcaa5;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="dialogue-box" id="dialogueBox">
    <div class="dialogue-text" id="dialogueText">Hi there! 👋 I'm Eilik, your friendly tutorial buddy. Let's get started!</div>
  </div>

  <div class="scene">
    <div class="robot-container" id="robot">
      <div class="robot-head">
        <div class="ear-l"></div>
        <div class="ear-r"></div>
        <div class="face-screen">
          <svg id="face" viewBox="0 0 68 68" width="68" height="68"></svg>
        </div>
      </div>
      <div class="robot-body">
        <div class="body-decor"></div>
        <div class="arm-l"></div>
        <div class="arm-r" id="armR"></div>
        <span class="name-tag">Eilik</span>
      </div>
      <div class="base"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn" onclick="prevStep()">← Back</button>
    <button class="btn primary" id="nextBtn" onclick="nextStep()">Next →</button>
  </div>
</div>

<script>
const steps=[
  {text:"Hi! I'm Eilik. To change the app's look, tap the Theme 🎨 icon at the top of the Home screen!", face:"happy", anim:"point-tr"},
  {text:"Tap the ⋮ (More) menu to find the Toggle Schedule Widget option! 📅", face:"curious", anim:"point-tr"},
  {text:"Love the app? Tap the Share 📤 icon at the top to send it to your friends!", face:"smile", anim:"point-tr"},
  {text:"Tap the huge ➕ button to add a new Task! You can always tap an existing task to edit it later. ✍️", face:"oops", anim:"point-br"},
  {text:"Switch to the Schedule tab to plan your day. To delete a schedule, just swipe it to the left! 🎉", face:"celebrate", anim:"point-down"}
];

const faces={
  happy:`<circle cx="34" cy="34" r="30" fill="#111"/><path d="M20 30 Q22 24 26 28" stroke="#00e5cc" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M48 30 Q46 24 42 28" stroke="#00e5cc" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M19 40 Q34 52 49 40" stroke="#00e5cc" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
  smile:`<circle cx="34" cy="34" r="30" fill="#111"/><ellipse cx="26" cy="31" rx="5" ry="5" fill="none" stroke="#00e5cc" stroke-width="2"/><ellipse cx="42" cy="31" rx="5" ry="5" fill="none" stroke="#00e5cc" stroke-width="2"/><path d="M22 43 Q34 51 46 43" stroke="#00e5cc" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
  curious:`<circle cx="34" cy="34" r="30" fill="#111"/><ellipse cx="26" cy="30" rx="6" ry="7" fill="#00e5cc" opacity=".9"/><ellipse cx="42" cy="30" rx="6" ry="7" fill="#00e5cc" opacity=".9"/><ellipse cx="26" cy="30" rx="3" ry="4" fill="#111"/><ellipse cx="42" cy="30" rx="3" ry="4" fill="#111"/><path d="M28 44 Q34 47 40 44" stroke="#00e5cc" stroke-width="2" fill="none" stroke-linecap="round"/><text x="48" y="22" font-size="11" fill="#00e5cc" font-family="sans-serif">?</text>`,
  oops:`<circle cx="34" cy="34" r="30" fill="#111"/><line x1="22" y1="26" x2="30" y2="34" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/><line x1="30" y1="26" x2="22" y2="34" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/><line x1="38" y1="26" x2="46" y2="34" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/><line x1="46" y1="26" x2="38" y2="34" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/><path d="M22 46 Q34 41 46 46" stroke="#ff6b6b" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
  celebrate:`<circle cx="34" cy="34" r="30" fill="#111"/><path d="M20 28 Q22 22 26 26" stroke="#ffd700" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M48 28 Q46 22 42 26" stroke="#ffd700" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M19 38 Q34 50 49 38" stroke="#ffd700" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
};

let current=0;

function setStep(i){
  current=i;
  const s=steps[i];
  document.getElementById('dialogueText').textContent=s.text;
  document.getElementById('face').innerHTML=faces[s.face];
  
  const robot=document.getElementById('robot');
  robot.className='robot-container';
  if(s.anim){void robot.offsetWidth;robot.className='robot-container '+s.anim;}
  
  document.getElementById('prevBtn').style.visibility = (i===0) ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = (i===steps.length-1) ? 'Finish ✓' : 'Next →';
  
  if(window.Android) {
    window.Android.onStepChanged(i);
  }
}

function nextStep(){
  if(current===steps.length-1){
    if(window.Android){
      window.Android.closeTutorial();
    }
  } else {
    setStep(current+1);
  }
}

function prevStep(){
  if(current>0)setStep(current-1);
}

setStep(0);
</script>
</body>
</html>
